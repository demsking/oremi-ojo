[project]
name = "oremi-weather-agent"
version = "3.0.0-beta12"
description = "A comprehensive climate agent for weather forecasts, geocoding, and pollen data"
keywords = ["forecast", "air quality", "pollen", "geocoding"]
authors = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
maintainers = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi-mcp>=0.4.0",
  "fastapi[standard]>=0.115.12",
  "hishel>=0.1.2",
  "numpy>=2.2.5",
  "ollama>=0.4.8",
  "openmeteo-requests>=1.4.0",
  "oremi-core>=2.5.3",
  "pydantic-ai>=2.8.0",
  "pydantic-settings>=2.14.2",
  "pytz>=2025.2",
  "requests-cache>=1.2.1",
  "retry-requests>=2.0.0",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/oremi-weather-agent"
"Source" = "https://gitlab.com/demsking/oremi-weather-agent"
"Issues" = "https://gitlab.com/demsking/oremi-weather-agent/-/issues"

[project.scripts]
oremi-weather = "weather.__main__:start"

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "bandit>=1.9.4",
  "pylint>=3.3.7",
  "pyroma>=4.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-dotenv>=1.1.0",
  "python-slugify>=8.0.4",
  "reorder-python-imports>=3.14.0",
  "trio>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weather"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]
