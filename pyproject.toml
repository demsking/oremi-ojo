[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "oremi-forecast"
version = "1.2.0"
description = "A comprehensive API for weather forecasts, geocoding, and pollen data"
keywords = ["forecast", "air quality", "pollen", "geocoding"]
authors = ["Sébastien Demanou <demsking@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://gitlab.com/demsking/oremi-forecast"
documentation = "https://gitlab.com/demsking/oremi-forecast/-/blob/main/README.md"
package-mode = false

include = []
exclude = []

[tool.poetry.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/oremi-forecast"
"Tracker" = "https://gitlab.com/demsking/oremi-forecast/-/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.111.0"
hishel = "^0.1.1"
dataclasses-json = "^0.6.7"
oremi-core = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
trio = "^0.25.1"
pytest-asyncio = "^0.23.7"
pylint = "^3.2.4"
python-lsp-server = "^1.12.0"

[tool.skjold]
sources = ["pyup", "gemnasium", "osv", "pypa"]
report_only = false # Exit with non-zero exit code on findings.

[tool.pytest.ini_options]
# Function starting with the following pattern are considered for test cases.
python_functions = "test_"
